name: "DevSecOps Infrastructure Deployment"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  
permissions:
  id-token: write # MANDATORY for Zero Trust cryptographic OIDC handshake tokens
  contents: read  # MANDATORY to securely pull down your repository code

jobs:
  validate:
    name: "Lint and Validate IaC"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::629897139637:role/devops-lab-github-actions-role
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false


      - name: Terraform Format Check
        run: make format-all

      - name: Validate All Tiers
        run: make validate-all



      # 🔍 TRIVY TARGET: Point directly to the app-sandbox subdirectory folder
      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          hide-progress: true
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true

  deploy:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    needs: validate 
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 📁 DEFAULT: Forces all run steps in this job to execute inside the sandbox folder
    env:
      # Inject the secret directly into the runner environment
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::629897139637:role/devops-lab-github-actions-role
          aws-region: us-east-1

      # The Makefile handles all directory transitions and dependency order
      - name: Execute Full Deployment Pipeline
        run: |
          export PATH="$PATH:/opt/hostedtoolcache/terraform/1.15.5/x64"
          make deploy-all
        env:
          # Automatically satisfies both variables across all directories
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_admin_ssh_cidr: "0.0.0.0/0"