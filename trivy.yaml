    # 02-ingress Overrides
    - id: AWS-0052 # Approved: HTTP test headers permitted for mock ingress verification
    - id: AWS-0053 # Approved: ALB is internet-facing to allow public lab validation checks
    - id: AWS-0054 # Approved: Port 80 HTTP permitted; sandbox bypasses ACM SSL/TLS stack