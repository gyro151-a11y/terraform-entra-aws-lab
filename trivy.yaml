# Centralized SecOps Compliance Overrides for DevOps Sandbox Lab
misconfiguration:
  ignore-policy: ""
  ignores:
    # 00-bootstrap Overrides
    - id: AWS-0089 # Approved: S3 bucket logging disabled to eliminate lab storage/cost clutter
    - id: AWS-0090 # Approved: S3 native versioning handled via sub-resource block layer
    - id: AWS-0132 # Approved: Native free-tier SSE-S3 (AES256) used over provisioned KMS keys

    # 01-network Overrides
